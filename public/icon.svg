<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFDD33"/>
      <stop offset="100%" stop-color="#FFC000"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="#000000" stroke-width="18"/>

  <!-- Isometric 3D Q-Cube Container -->
  <g transform="translate(256, 230)" stroke="#000000" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Face -->
    <path d="M 0,-115 L 110,-52 L 0,10 L -110,-52 Z" fill="#FFFFFF"/>
    <!-- Left Dark Face -->
    <path d="M -110,-52 L 0,10 L 0,135 L -110,72 Z" fill="#18181B"/>
    <!-- Right Golden Face -->
    <path d="M 0,10 L 110,-52 L 110,72 L 0,135 Z" fill="#EAB308"/>

    <!-- Subtle Isometric Grid Cuts on Top Face -->
    <path d="M -55,-21 L 55,-83" stroke="#E4E4E7" stroke-width="6"/>
    <path d="M 55,-21 L -55,-83" stroke="#E4E4E7" stroke-width="6"/>

    <!-- Dynamic Download Arrow (Front Center) -->
    <path d="M 0,-40 L 0,55" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
    <path d="M -36,20 L 0,56 L 36,20" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0,-40 L 0,55" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
    <path d="M -36,20 L 0,56 L 36,20" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Base Tray Accent (Tray/Drive) -->
    <path d="M -65,95 L 0,132 L 65,95" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Q Accent Tag on Bottom Right -->
  <rect x="340" y="360" width="60" height="26" rx="8" fill="#000000" transform="rotate(32 340 360)"/>
  <rect x="345" y="364" width="50" height="18" rx="5" fill="#FFD028" transform="rotate(32 340 360)"/>
</svg>
